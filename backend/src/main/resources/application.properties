spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nepal_tourism?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
server.port=${SERVER_PORT:8080}
jwt.secret=${JWT_SECRET:change-this-development-secret-at-least-32-characters}
jwt.expiration=${JWT_EXPIRATION:86400000}
